name: Preprocessing Dataset

on:
  push:
    branches: [main]
    paths:
      - "Energy_raw/**"
      - "Preprocessing/Automate.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas scikit-learn joblib

      - name: Jalankan preprocessing
        run: python Preprocessing/Automate.py

      - name: Commit dataset hasil preprocessing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Preprocessing/energy_preprocessing
          git diff --staged --quiet || git commit -m "chore: update dataset preprocessing"
          git push
